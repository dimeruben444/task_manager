{% load i18n %}

<div class="modal fade" id="clearCompletedModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden text-center p-3">
            <h6 class="fw-bold mb-2">{% translate "Vaciar completadas" %}</h6>
            <p class="text-muted small mb-3">{% translate "¿Deseas eliminar permanentemente las tareas completadas?" %}</p>
            <form method="POST" action="{% url 'clear_completed_tasks' %}" class="m-0">
                {% csrf_token %}
                <input type="hidden" name="time_filter" id="modal-time-filter-input" value="all">
                <button type="submit" class="btn btn-danger btn-sm fw-bold w-100">{% translate "Eliminar definitivamente" %}</button>
            </form>
        </div>
    </div>
</div>
