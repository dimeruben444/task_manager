{% load static %}

<div class="modal fade" id="mobileActionModal{{ task.id }}" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content border-0 shadow-lg rounded-5 overflow-hidden">
            
            <div class="modal-header border-bottom py-2.5 px-3 bg-light d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center gap-2 min-w-0 flex-grow-1 pe-2">
                    
                    {% if task.urgency >= 3 and task.importance >= 3 %}
                        <span class="quadrant-icon-box q1-bg flex-shrink-0 d-inline-flex align-items-center justify-content-center" style="width: 26px; height: 26px; border-radius: 6px;">
                            <img src="{% static 'img/fire.svg' %}" alt="Q1" width="14" height="14" class="d-block">
                        </span>
                    {% elif task.urgency <= 2 and task.importance >= 3 %}
                        <span class="quadrant-icon-box q2-bg flex-shrink-0 d-inline-flex align-items-center justify-content-center" style="width: 26px; height: 26px; border-radius: 6px;">
                            <img src="{% static 'img/calendar.svg' %}" alt="Q2" width="14" height="14" class="d-block">
                        </span>
                    {% elif task.urgency >= 3 and task.importance <= 2 %}
                        <span class="quadrant-icon-box q3-bg flex-shrink-0 d-inline-flex align-items-center justify-content-center" style="width: 26px; height: 26px; border-radius: 6px;">
                            <img src="{% static 'img/group.svg' %}" alt="Q3" width="14" height="14" class="d-block">
                        </span>
                    {% else %}
                        <span class="quadrant-icon-box q4-bg flex-shrink-0 d-inline-flex align-items-center justify-content-center" style="width: 26px; height: 26px; border-radius: 6px;">
                            <img src="{% static 'img/trash.svg' %}" alt="Q4" width="14" height="14" class="d-block">
                        </span>
                    {% endif %}

                    <h6 class="fw-bold mb-0 text-dark text-truncate small" title="{{ task.title }}">
                        {{ task.title }}
                    </h6>
                </div>

                <button type="button" class="btn-close btn-sm flex-shrink-0" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <div class="modal-body p-3 d-flex flex-row gap-2 bg-white">
                <button type="button" 
                        class="btn text-center flex-fill py-2.5 px-2 border-0 rounded-3 d-flex align-items-center justify-content-center gap-2 text-white shadow-sm" 
                        style="background: linear-gradient(315deg, #7ce6c2 0%, #059669 100%); font-weight: 600; font-size: 0.85rem;"
                        onclick="executeMobileComplete('{{ task.id }}')">
                    <i class="bi bi-check-circle-fill fs-6 text-white"></i>
                    <span>Completar</span>
                </button>

                <button type="button" 
                        class="btn text-center flex-fill py-2.5 px-2 border-0 rounded-3 d-flex align-items-center justify-content-center gap-2 text-white shadow-sm" 
                        style="background: linear-gradient(315deg, #99c7e5 0%, #3B82F6 100%); font-weight: 600; font-size: 0.85rem;"
                        onclick="executeMobileEdit('{{ task.id }}')">
                    <i class="bi bi-pencil-square fs-6 text-white"></i>
                    <span>Editar</span>
                </button>
            </div>

        </div>
    </div>
</div>
