{% load i18n %}

<div class="completed-panel-wrapper w-100">
    <div class="d-lg-none mb-3">
        <button class="btn btn-white border shadow-sm w-100 py-2.5 px-3 rounded-3 d-flex align-items-center justify-content-between text-dark fw-bold" 
                type="button" 
                data-bs-toggle="collapse" 
                data-bs-target="#collapseCompletedTablet" 
                aria-expanded="false">
            <div class="d-flex align-items-center gap-2">
                <span class="rounded-circle bg-success-subtle text-success p-1 d-inline-flex align-items-center justify-content-center" style="width: 24px; height: 24px;">
                    <i class="bi bi-check-lg fw-bold"></i>
                </span>
                <span>{% translate "Ver tareas completadas" %}</span>
            </div>
            <span class="badge bg-primary text-white rounded-pill" id="completed-count-mobile">
                {{ completed_tasks|length }}
            </span>
        </button>
    </div>

    <div class="collapse d-lg-block" id="collapseCompletedTablet">
        <div class="completed-panel p-3 h-100 d-flex flex-column bg-white border rounded-4 shadow-sm">
            <div class="d-flex align-items-center justify-content-between pb-3 border-bottom mb-2">
                <div class="d-flex align-items-center gap-2">
                    <span class="rounded-circle bg-success-subtle text-success p-1 d-inline-flex align-items-center justify-content-center" style="width: 26px; height: 26px;">
                        <i class="bi bi-check-lg fw-bold"></i>
                    </span>
                    <h6 class="fw-bold mb-0 text-dark" style="font-size: 0.95rem;">
                        {% translate "Completadas" %}
                    </h6>
                    <span class="badge bg-light text-dark border rounded-circle" id="completed-count">
                        {{ completed_tasks|length }}
                    </span>
                </div>

                <div class="d-flex align-items-center gap-1">
                    <select id="completed-filter-select" class="form-select form-select-sm border-0 shadow-none bg-light py-1 px-2 text-muted" style="font-size: 0.78rem; width: auto; cursor: pointer;">
                        <option value="all" selected>{% translate "Todas" %}</option>
                        <option value="today">{% translate "Hoy" %}</option>
                        <option value="week">{% translate "Esta semana" %}</option>
                    </select>

                    <button type="button" class="btn btn-outline-danger btn-sm p-1.5 border-0 rounded-2" data-bs-toggle="modal" data-bs-target="#clearCompletedModal" title="{% translate 'Vaciar completadas' %}">
                        <i class="bi bi-trash3"></i>
                    </button>
                </div>
            </div>

            <div class="flex-grow-1 overflow-auto quadrant-container py-2" id="completed-tasks-container" data-quadrant="DONE" style="max-height: calc(100vh - 280px); min-height: 200px;">
                {% for task in completed_tasks %}
                    <div class="completed-item completed-task-item task-card mb-2 d-flex align-items-center justify-content-between gap-2" 
                        data-task-id="{{ task.id }}"
                        data-urgency="{{ task.urgency }}"
                        data-importance="{{ task.importance }}"
                        data-updated-at="{{ task.updated_at|date:'Y-m-d' }}">
                        
                        <div class="d-flex align-items-center gap-2 flex-grow-1 min-w-0">
                            <div class="task-checkbox-wrapper-sidebar flex-shrink-0" style="width: 17px; height: 17px;">
                                <label class="task-checkbox-container m-0" onclick="event.stopPropagation();">
                                    <input type="checkbox" 
                                        class="task-completion-check" 
                                        data-task-id="{{ task.id }}" 
                                        checked>
                                    <span class="checkmark"></span>
                                </label>
                            </div>
                            
                            <span class="task-title text-muted text-decoration-line-through text-truncate fw-medium" 
                                style="font-size: 0.82rem; cursor: pointer;" 
                                title="{{ task.title }}"
                                data-bs-toggle="modal" 
                                data-bs-target="#viewTaskModal{{ task.id }}">
                                {{ task.title }}
                            </span>
                        </div>

                        <form method="POST" action="{% url 'delete_task' task.id %}" class="d-inline m-0 flex-shrink-0" onsubmit="return confirm('¿Eliminar esta tarea definitivamente?');">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-link text-danger p-0 border-0 opacity-50 hover-opacity-100" title="Eliminar">
                                <i class="bi bi-x-lg" style="font-size: 0.8rem;"></i>
                            </button>
                        </form>
                    </div>
                {% empty %}
                    <p class="text-muted text-center py-4 small mb-0 empty-msg" id="empty-trash-msg">
                        {% translate "No hay tareas completadas." %}
                    </p>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
