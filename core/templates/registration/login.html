{% extends 'base/base.html' %}
{% load i18n %}

{% block title %}{% translate "Iniciar Sesión" %}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h3 class="fw-bold text-center mb-4">🔑 {% translate "Iniciar Sesión" %}</h3>
                    
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label small fw-bold">{% translate "Usuario" %}</label>
                            <input type="text" name="username" class="form-control" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">{% translate "Contraseña" %}</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary fw-bold">{% translate "Entrar" %}</button>
                        </div>
                    </form>

                    <div class="text-center mt-3">
                        <small class="text-muted">
                            {% translate "¿No tienes cuenta?" %} 
                            <a href="{% url 'register' %}" class="text-decoration-none">{% translate "Regístrate aquí" %}</a>
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
